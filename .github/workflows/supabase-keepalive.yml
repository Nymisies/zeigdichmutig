name: Supabase Keepalive

# Pingt die Supabase-Datenbank regelmäßig an, damit das Free-Tier-Projekt nicht
# nach 7 Tagen Inaktivität automatisch pausiert wird. Läuft server-seitig auf
# GitHub, unabhängig davon, ob irgendein Rechner an ist.

on:
  schedule:
    - cron: '0 6 */6 * *'   # alle 6 Tage, 06:00 UTC
  workflow_dispatch:        # manuell auslösbar über den "Actions"-Tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        run: |
          curl -sf "https://fefpwimrvgfxyfgwltow.supabase.co/rest/v1/submissions?select=id&limit=1" \
            -H "apikey: sb_publishable_2X0J8luOKzZfzE5HMYr6tw_d0mTh895" \
            -H "Authorization: Bearer sb_publishable_2X0J8luOKzZfzE5HMYr6tw_d0mTh895" \
            -o /dev/null -w "Supabase-Ping: HTTP %{http_code}\n"
